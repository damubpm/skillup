<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill UP</title>
  <style>
    :root {
      --bg: #f7f1e3;
      --paper: #fffaf0;
      --ink: #1d2a2a;
      --accent: #0f6b5d;
      --accent-2: #b36b2c;
      --gold: #d9a441;
      --line: rgba(15, 107, 93, 0.18);
      --shadow: 0 18px 45px rgba(36, 48, 46, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(217,164,65,.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(15,107,93,.10), transparent 34%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .page {
      width: min(1100px, 100%);
      background: var(--paper);
      border-radius: 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(179,107,44,.14);
    }

    .ornament-strip {
      height: 22px;
      background:
        linear-gradient(45deg, transparent 42%, var(--gold) 42% 58%, transparent 58%) 0 0/24px 24px,
        linear-gradient(-45deg, transparent 42%, var(--accent) 42% 58%, transparent 58%) 12px 0/24px 24px;
      opacity: .9;
    }

    .ornament {
      position: absolute;
      width: 150px;
      height: 150px;
      opacity: .13;
      pointer-events: none;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      position: absolute;
      inset: 28px;
      border: 10px solid var(--accent);
      border-radius: 46% 54% 50% 50%;
      transform: rotate(45deg);
    }

    .ornament::after {
      inset: 52px;
      border-color: var(--gold);
      border-width: 8px;
      border-radius: 18px 50px 18px 50px;
      transform: rotate(-45deg);
    }

    .o1 { top: 65px; left: -34px; }
    .o2 { right: -34px; bottom: 35px; transform: rotate(180deg); }

    header {
      padding: 70px 70px 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(15,107,93,.18);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      background: rgba(15,107,93,.05);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(46px, 7vw, 84px);
      line-height: .95;
      margin: 22px 0 14px;
      letter-spacing: -0.05em;
      color: var(--accent);
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto;
      color: #5d6967;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.55;
    }

    .content {
      padding: 12px 70px 70px;
      position: relative;
      z-index: 1;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--accent-2);
      margin-bottom: 18px;
    }

    .card {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 22px;
      align-items: center;
      padding: 26px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 34px rgba(15,107,93,.12);
      border-color: rgba(15,107,93,.34);
    }

    .icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(15,107,93,.10), rgba(217,164,65,.16));
      color: var(--accent);
      font-size: 34px;
      border: 1px solid rgba(15,107,93,.12);
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .card p {
      margin: 0;
      color: #6a7472;
      line-height: 1.5;
    }

    .arrow {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-size: 24px;
      transition: transform .22s ease;
    }

    .card:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 26px;
      border-top: 1px solid rgba(179,107,44,.12);
      color: #7c8583;
      font-size: 14px;
    }

    .mini-ornament {
      width: 34px;
      height: 14px;
      background:
        linear-gradient(45deg, transparent 38%, var(--gold) 38% 62%, transparent 62%) 0 0/14px 14px,
        linear-gradient(-45deg, transparent 38%, var(--accent) 38% 62%, transparent 62%) 7px 0/14px 14px;
    }

    @media (max-width: 720px) {
      body { padding: 14px; }
      header { padding: 52px 24px 28px; }
      .content { padding: 8px 24px 42px; }
      .card {
        grid-template-columns: 68px 1fr;
      }
      .icon {
        width: 68px;
        height: 68px;
        font-size: 28px;
      }
      .arrow {
        grid-column: 1 / -1;
        width: 100%;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="ornament-strip"></div>
    <div class="ornament o1"></div>
    <div class="ornament o2"></div>

    <header>
      <div class="badge">Оқы • Үйрен • Дамы</div>
      <h1>Skill UP</h1>
      <p class="subtitle">
        Пространство для обучения и развития навыков.
        Выберите нужный раздел и продолжайте обучение.
      </p>
    </header>

    <section class="content">
      <div class="section-title">Учебные материалы</div>

      <a class="card" href="english_grammar.html">
        <div class="icon">Aa</div>
        <div>
          <h2>Грамматика Английский язык</h2>
          <p>
            Интерактивное изучение английской грамматики:
            правила, примеры и проверка знаний.
          </p>
        </div>
        <div class="arrow">→</div>
      </a>
    </section>

    <footer>
      <span class="mini-ornament"></span>
      <span>Skill UP • Білімге бір қадам жақын</span>
      <span class="mini-ornament"></span>
    </footer>
  </main>
</body>
</html>
